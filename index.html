<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Camino al 70.3</title>
  <meta name="description" content="Tu plan de entrenamiento para el Ironman 70.3: qué toca hoy, registro y progreso.">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="70.3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="today" class="active"><span class="ti">🏁</span><span>Hoy</span></button>
    <button data-tab="week"><span class="ti">📅</span><span>Semana</span></button>
    <button data-tab="progress"><span class="ti">📈</span><span>Progreso</span></button>
    <button data-tab="settings"><span class="ti">⚙️</span><span>Ajustes</span></button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="plan.js"></script>
  <script src="app.js"></script>
</body>
</html>
